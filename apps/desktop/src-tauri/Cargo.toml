[package]
name = "ai-integrator-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ai_integrator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adapter-acp = { path = "../../../crates/adapter-acp" }
adapter-codex = { path = "../../../crates/adapter-codex" }
base64.workspace = true
chrono.workspace = true
directories.workspace = true
dunce.workspace = true
futures-util.workspace = true
# ripgrep's own walker and searcher, used in-process by `workspace_search`:
# real .gitignore semantics and no `rg` binary to locate or parse.
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
integrator-core = { path = "../../../crates/integrator-core" }
integrator-runtime = { path = "../../../crates/integrator-runtime" }
keyring = "4.1.4"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
rand.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
session-store = { path = "../../../crates/session-store" }
sha2.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url.workspace = true
uuid.workspace = true
which.workspace = true
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize.workspace = true

# A dev server the app started must die with the app even when the app is
# killed, so `dev_server::guard` puts every child in a job object that the OS
# reaps when our handle closes. `Drop` alone never runs on a force-kill.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
