[package]
name = "ai-integrator-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ai_integrator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adapter-acp = { path = "../../../crates/adapter-acp" }
adapter-codex = { path = "../../../crates/adapter-codex" }
base64.workspace = true
chrono.workspace = true
directories.workspace = true
dunce.workspace = true
futures-util.workspace = true
integrator-core = { path = "../../../crates/integrator-core" }
integrator-runtime = { path = "../../../crates/integrator-runtime" }
keyring = "4.1.4"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
rand.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
session-store = { path = "../../../crates/session-store" }
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url.workspace = true
uuid.workspace = true
which.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
