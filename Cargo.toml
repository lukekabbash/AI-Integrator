[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/adapter-acp",
  "crates/adapter-codex",
  "crates/integrator-core",
  "crates/integrator-runtime",
  "crates/session-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
dunce = "1"
parking_lot = "0.12"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
which = "8"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
